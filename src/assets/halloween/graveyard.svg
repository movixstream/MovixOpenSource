  <!-- Lumières : vitre de la lanterne et visage de la citrouille. -->
  <path fill="#fdba74" d="M759 76h10v13h-10z"/>
  <path fill="#08070b" d="M763.5 76h1v13h-1z"/>
  <path fill="#fb923c" d="M1197 132l3-5 3 5zM1205 132l3-5 3 5zM1195 137q9 7 18 0l-2.5 1-1.5-2-2 2-2-2-2 2-2-2-1.5 2z"/>
