<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 160" width="2400" height="160">
  <!-- Cimetière en silhouette du pied de page (thème Halloween). Même teinte
       que le fond du pied de page : le sol se fond dedans. La bande se répète
       à l'horizontale : le sol est à la même hauteur aux deux bords. -->
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fdba74" stop-opacity=".7"/>
      <stop offset=".3" stop-color="#f97316" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halos de la lanterne et de la citrouille, derrière les silhouettes. -->
  <circle cx="766" cy="83" r="30" fill="url(#glow)"/>
  <circle cx="1204" cy="133" r="30" fill="url(#glow)"/>

  <g fill="#08070b">
