apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// libcurl-impersonate (github.com/lexiforest/curl-impersonate) : la pile TLS et
// HTTP/2 de curl_cffi, que le relais Python utilise deja. Le proxy media s'en
// sert pour imiter un vrai Chrome face a Fsvid/Vidzy (voir
// ImpersonateMediaProxyUpstream). Les archives de la release sont telechargees
// au build et verifiees par SHA-256 ; CMake empaquette la .so avec notre pont.
def curlImpersonateVersion = "2.3.1"
def curlImpersonateArchives = [
    "arm64-v8a"  : ["aarch64", "fd8a9ba3386d10f8519fcff3b50f655a41fd38e5e5a2fb8eabcac6085587bcbf"],
    "armeabi-v7a": ["armv7", "a3ca8c80d74fcc6ba4dd92bedb0c9a82bb2246806e5116294196351cfd8fbede"],
    "x86"        : ["x86", "22bc873b2ba2eae98367a34155107df6c6b221b707e5b8be0bc4746db25ea389"],
    "x86_64"     : ["x86_64", "d7f7d00b3bd0eae23eb7440e374ffbbbf978be782f8ebddccf888a1677282513"],
]
def curlImpersonateDir = layout.buildDirectory.dir("curl-impersonate/${curlImpersonateVersion}")

android {
    namespace "com.movix.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.movix.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 49
        versionName "2.6.12"

        buildConfigField "int", "VERSION_CODE_INT", "${versionCode}"
        buildConfigField "String", "VERSION_NAME_STR", "\"${versionName}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreProperties['MOVIX_RELEASE_STORE_FILE']) {
                storeFile file(keystoreProperties['MOVIX_RELEASE_STORE_FILE'])
                storePassword keystoreProperties['MOVIX_RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['MOVIX_RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['MOVIX_RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig keystoreProperties['MOVIX_RELEASE_STORE_FILE'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        // play-services-cronet (et Cast recents) sont compiles avec des
        // metadonnees Kotlin 2.1 que le compilateur 1.9.24 (impose par le plugin
        // Gradle de RN 0.75.4) refuse par defaut. On consomme juste leur API
        // (CronetEngine, Tasks) -> on tolere la version de metadonnees.
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }

    // Pont JNI vers libcurl-impersonate (src/main/cpp), pour le proxy media.
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        externalNativeBuild {
            cmake {
                // C pur : pas de libc++ a nous. Celle que demande
                // libcurl-impersonate.so (libc++_shared.so) vient de React Native.
                arguments "-DANDROID_STL=none",
                    "-DCURL_IMPERSONATE_ROOT=${curlImpersonateDir.get().asFile.absolutePath.replace('\\', '/')}"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

def sha256Of = { File file ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int read
        while ((read = input.read(buffer)) > 0) digest.update(buffer, 0, read)
    }
    digest.digest().encodeHex().toString()
}

def prepareCurlImpersonate = tasks.register("prepareCurlImpersonate") {
    def outputDir = curlImpersonateDir.get().asFile
    inputs.property("version", curlImpersonateVersion)
    inputs.property("archives", curlImpersonateArchives.toString())
    outputs.dir(outputDir)
    doLast {
        curlImpersonateArchives.each { abi, spec ->
            def (triple, expectedSha) = spec
            def name = "libcurl-impersonate-v${curlImpersonateVersion}.${triple}-linux-android.tar.gz"
            def archive = new File(outputDir, name)
            if (!archive.exists() || sha256Of(archive) != expectedSha) {
                archive.parentFile.mkdirs()
                def url = "https://github.com/lexiforest/curl-impersonate/releases/download/v${curlImpersonateVersion}/${name}"
                new URL(url).withInputStream { input -> archive.withOutputStream { it << input } }
            }
            def actualSha = sha256Of(archive)
            if (actualSha != expectedSha) {
                archive.delete()
                throw new GradleException("SHA-256 inattendu pour ${name} : ${actualSha}")
            }
            def abiDir = new File(outputDir, abi)
            project.delete(abiDir)
            project.copy {
                from(tarTree(resources.gzip(archive)))
                include("include/**", "libcurl-impersonate.so", "LICENSE*")
                into(abiDir)
            }
        }
    }
}
preBuild.dependsOn(prepareCurlImpersonate)

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // Google Cast (Chromecast) - see app/src/main/java/com/movix/app/cast/
    // Rester en 21.5.0 tant que RN est en 0.75.4 : la 22.3.1 est compilee en
    // Kotlin 2.2 et le compilateur 1.9.24 impose par le plugin Gradle de RN ne
    // sait pas lire ses metadonnees. Les APIs utilisees ici existent en 21.5.0.
    implementation("com.google.android.gms:play-services-cast-framework:21.5.0")
    implementation("androidx.mediarouter:mediarouter:1.7.0")

    // Cronet (moteur reseau Chromium, charge depuis GMS) pour le proxy media :
    // les CDN fsvid/vidzy filtrent la signature TLS d'okhttp (bloque comme
    // scraper). Cronet presente la vraie signature Chrome -> le CDN sert le
    // vrai flux au lieu d'un 403 / leurre. Repli sur okhttp si Cronet indispo.
    // Voir CronetMediaProxyUpstream.
    implementation("com.google.android.gms:play-services-cronet:18.1.1")

    // Robolectric n'expose JUnit qu'au runtime : sans cette ligne tout
    // src/test/ echoue a la compilation sur "Unresolved reference: junit".
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.14.1")
}
