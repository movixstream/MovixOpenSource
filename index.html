        <!-- JSON-LD. Un seul objet avec @graph, pas un tableau : Safari 18+
             injecte dans chaque page un lecteur de données structurées qui
             suppose un objet et plante sur un tableau
             (`r["@context"].toLowerCase`), une erreur dans la console de
             chaque visiteur Safari. @graph est la forme recommandée par
             schema.org et comprise par Google. -->
        <script type="application/ld+json" data-rh="true">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "Organization",
                        "name": "Movix",
                        "alternateName": "Movix Streaming",
                        "url": "__MOVIX_SITE_URL__",
                        "description": "Movix est une plateforme française open-source (CC BY-NC 4.0) de streaming multimédia : films, séries, anime, TV en direct et Watch Parties synchronisées.",
                        "logo": {
                            "@type": "ImageObject",
                            "url": "__MOVIX_SITE_URL__/movix.png",
                            "width": 512,
                            "height": 512
                        },
                        "sameAs": ["https://t.me/movix_site"],
                        "contactPoint": {
                            "@type": "ContactPoint",
                            "contactType": "customer support",
                            "email": "movixstreaming@gmail.com",
                            "availableLanguage": ["French", "English"]
                        }
                    },
                    {
                        "@type": "WebSite",
                        "name": "Movix",
                        "url": "__MOVIX_SITE_URL__",
                        "inLanguage": "fr",
                        "potentialAction": {
                            "@type": "SearchAction",
                            "target": {
                                "@type": "EntryPoint",
                                "urlTemplate": "__MOVIX_SITE_URL__/search?q={search_term_string}"
                            },
                            "query-input": "required name=search_term_string"
                        }
                    }
                ]
            }
        </script>
        <script>
            // Stockage de secours, avant tout autre script. Quand le navigateur
            // refuse le stockage (cookies bloqués, iframe sandboxée, WebView sans
            // DOM storage, base Firefox corrompue), le simple accès à
            // `localStorage` jette (SecurityError « Access is denied » ou « The
            // operation is insecure », NS_ERROR_FAILURE), vaut null ou n'existe
            // pas. Plus de 700 accès directs du code supposent un stockage
            // utilisable : chacun devenait un écran de crash (GlitchTip B2, ED,
            // E6, DN, CB…). Ici, un stockage en mémoire prend la place de la
            // propriété : le site reste utilisable pendant la visite, rien n'est
            // conservé après. La sonde ne fait que lire : un stockage simplement
            // plein reste le vrai, pour ne pas masquer les données existantes.
            // ES5 uniquement : ce bloc n'est pas transpilé.
            (function () {
                var reserved = { getItem: 1, setItem: 1, removeItem: 1, clear: 1, key: 1, length: 1 };

                function createMemoryStorage() {
                    var data = Object.create(null);
                    var storage = Object.create({
                        getItem: function (key) {
                            key = String(key);
                            return key in data ? data[key] : null;
                        },
                        setItem: function (key, value) {
                            key = String(key);
                            data[key] = String(value);
                            // Object.keys(localStorage) doit lister les clés,
                            // comme pour un vrai Storage.
                            if (!reserved[key]) {
                                Object.defineProperty(storage, key, {
                                    value: data[key],
                                    configurable: true,
                                    enumerable: true,
                                    writable: true,
                                });
                            }
                        },
                        removeItem: function (key) {
                            key = String(key);
                            delete data[key];
                            if (!reserved[key]) delete storage[key];
                        },
                        clear: function () {
                            var keys = Object.keys(data);
                            for (var i = 0; i < keys.length; i++) storage.removeItem(keys[i]);
                        },
                        key: function (index) {
                            var keys = Object.keys(data);
                            return index >= 0 && index < keys.length ? keys[index] : null;
                        },
                    });
                    Object.defineProperty(storage, "length", {
                        get: function () {
                            return Object.keys(data).length;
                        },
                    });
                    return storage;
                }

                function isUsable(name) {
                    try {
                        var storage = window[name];
                        if (!storage) return false;
                        storage.getItem("__movix_storage_probe__");
                        return true;
                    } catch (error) {
                        return false;
                    }
                }

                var names = ["localStorage", "sessionStorage"];
                for (var i = 0; i < names.length; i++) {
                    if (isUsable(names[i])) continue;
                    try {
                        Object.defineProperty(window, names[i], {
                            value: createMemoryStorage(),
                            configurable: true,
                            enumerable: true,
                            writable: false,
                        });
                        // Lu par la synchronisation de profil (App.tsx) : un
                        // stockage éphémère ne doit jamais servir de base de sync.
                        window.__MOVIX_MEMORY_STORAGE__ = window.__MOVIX_MEMORY_STORAGE__ || {};
                        window.__MOVIX_MEMORY_STORAGE__[names[i]] = true;
                    } catch (error) {
                        // Propriété non remplaçable : comportement d'origine.
                    }
                }
            })();
        </script>
        <script>
            // Object.hasOwn is ES2022 (Chrome 93+, Safari 15.4+, Firefox 92+). react-markdown
            // calls it directly; older Chromium builds (e.g. Chrome 88 on armv7l) crash without this.
            if (typeof Object.hasOwn !== "function") {
                Object.defineProperty(Object, "hasOwn", {
                    value: function (obj, prop) {
                        if (obj === null || obj === undefined) {
                            throw new TypeError(
                                "Cannot convert undefined or null to object"
                            );
                        }
                        return Object.prototype.hasOwnProperty.call(
                            Object(obj),
                            prop
                        );
                    },
                    configurable: true,
                    writable: true,
                });
            }
            // globalThis is Chrome 71+ and LG webOS 5 TVs run Chrome 68. gtag.js reads it,
            // and as an async classic script it can run before the core-js polyfill chunk
            // injected by @vitejs/plugin-legacy (a module script). ES5 only here, this block
            // is not transpiled.
            if (typeof globalThis === "undefined") {
                Object.defineProperty(window, "globalThis", {
                    value: window,
                    configurable: true,
                    writable: true,
                });
            }
        </script>
        <script>
            // Rechargement de secours quand le bundle d'entrée ne charge pas :
            // un vieux index.html (cache HTTP, edge) pointe vers un chunk hashé
            // qui n'existe plus → 404 → page blanche, main.tsx ne démarre
            // jamais, donc lazyWithRetry ne peut rien faire. Ce chemin ne
            // s'exécute que quand le site est déjà cassé : on repart de zéro
            // (SW désinscrit, caches vidés) et on recharge avec un paramètre
            // qui contourne le cache du document. Une seule fois par session
            // et par build, pour ne pas boucler si le HTML servi reste périmé.
            // Ce script classique n'est pas transpilé par Vite : rester en ES5
            // pour que la récupération fonctionne aussi avant le bundle legacy.
            (function () {
                var buildId = "%VITE_APP_BUILD_ID%";
                var recoveryStorageKey = "movix_build_recovery_" + buildId;
                var refreshSearchParam = "movix_build_refresh";
                var recoveryStarted = false;
                var recoveredFromUrl = false;

                function buildRecoveryUrl() {
                    var url = new URL(window.location.href);
                    url.searchParams.set(
                        refreshSearchParam,
                        buildId + "-" + Date.now()
                    );
                    return url.toString();
                }

                function recoverClientCache() {
                    return Promise.resolve().then(function () {
                        if ("serviceWorker" in navigator) {
                            return navigator.serviceWorker.getRegistrations()
                                .then(function (registrations) {
                                    return Promise.all(registrations.map(function (registration) {
                                        return registration.unregister();
                                    }));
                                });
                        }
                    }).then(function () {
                        if ("caches" in window) {
                            return caches.keys().then(function (cacheKeys) {
                                return Promise.all(cacheKeys.map(function (cacheKey) {
                                    return caches.delete(cacheKey);
                                }));
                            });
                        }
                    }).catch(function () {
                        // Ignore cleanup errors and continue with reload.
                    }).then(function () {
                        try {
                            sessionStorage.setItem(recoveryStorageKey, "done");
                        } catch (error) {
                            // Le paramètre d'URL empêche aussi une boucle sans stockage.
                        }
                        window.location.replace(buildRecoveryUrl());
                    });
                }

                try {
                    // Nettoie le paramètre laissé par un rechargement de secours.
                    var currentUrl = new URL(window.location.href);
                    if (currentUrl.searchParams.has(refreshSearchParam)) {
                        recoveredFromUrl = currentUrl.searchParams.get(refreshSearchParam)
                            .indexOf(buildId + "-") === 0;
                        currentUrl.searchParams.delete(refreshSearchParam);
                        window.history.replaceState(
                            {},
                            document.title,
                            currentUrl.toString()
                        );
                    }

                    // Clé de l'ancienne comparaison de build en localStorage.
                    // Supprimée : le SW ne met plus le HTML en cache, donc un
                    // nouveau build ne peut rien servir de périmé, et cette
                    // comparaison ne faisait que recharger deux fois et vider
                    // tous les caches à chaque déploiement. Plus lue nulle part.
                    localStorage.removeItem("movix_build_id");
                } catch (error) {
                    // Ignore storage errors.
                }

                window.addEventListener(
                    "error",
                    function (event) {
                        var target = event.target;
                        if (!(target instanceof HTMLScriptElement)) return;
                        if (target.type !== "module" && target.src.indexOf("-legacy") === -1) return;
                        if (target.src.indexOf("/assets/") === -1) return;
                        if (recoveryStarted || recoveredFromUrl) return;

                        // Le bundle legacy installe une vraie seconde tentative
                        // au niveau SystemJS. Laisser passer le premier `error`
                        // de sa balise dynamique ; si ce retry échoue aussi, le
                        // prochain événement reprend la purge/recharge ci-dessous.
                        // Les erreurs survenant avant l'installation du hook,
                        // notamment dans les polyfills, gardent la récupération
                        // directe.
                        try {
                            if (
                                typeof window.__MOVIX_DEFER_LEGACY_SCRIPT_RECOVERY__ ===
                                    "function" &&
                                window.__MOVIX_DEFER_LEGACY_SCRIPT_RECOVERY__(
                                    target.src
                                )
                            ) {
                                return;
                            }
                        } catch (error) {
                            // Une coordination défaillante ne doit pas désactiver
                            // la récupération historique du bootstrap.
                        }

                        try {
                            if (
                                sessionStorage.getItem(recoveryStorageKey) ===
                                "done"
                            ) {
                                return;
                            }
                        } catch (error) {
                            // Ignore storage errors.
                        }

                        recoveryStarted = true;
                        window.__MOVIX_CACHE_RECOVERY__ = recoverClientCache();
                    },
                    true
                );
            })();
        </script>
        <script
            src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"

        <script>
            // Cache-bust the Cast SDK URL on every page load so a stale SDK never
            // sticks around in the browser/SW cache (defensive — gstatic already
            // sets sane Cache-Control, but cinepulse does this too).
            (function loadCastSender() {
                var s = document.createElement("script");
                s.type = "text/javascript";
                s.src =
                    "https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1&cb=" +
                    Date.now();
                document.body.appendChild(s);
            })();
        </script>
